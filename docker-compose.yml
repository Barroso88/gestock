services:
  gestock:
    image: ghcr.io/barroso88/gestock:latest
    container_name: gestock
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Configurar com o utilizador, password e IP da sua base de dados PostgreSQL no Unraid
      - DATABASE_URL=postgresql://gestock_user:senha_segura@192.168.1.67:5432/gestock?schema=public
      - NEXT_PUBLIC_APP_URL=http://192.168.1.67:3000
      # Google OAuth 2.0 (Opcional - preencher se pretender usar login com Google)
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
    volumes:
      # Armazenamento persistente para fotos carregadas dos produtos
      - ./data:/app/data
